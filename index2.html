<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIN'T NO WAY Endless Menu</title>

<style>
:root{
  --bg:#05070b;
  --panel: rgba(255,255,255,.08);
  --panel2: rgba(255,255,255,.06);
  --stroke: rgba(255,255,255,.12);
  --neon:#00f5d4;
  --hot:#ff2d95;
  --sun:#ffe66d;
  --blue:#60a5fa;
  --green:#34d399;
  --amber:#f59e0b;
  --white:#f8fafc;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0;display:grid;place-items:center;
  overscroll-behavior:none;
  background:
    radial-gradient(circle at 15% 15%, rgba(0,245,212,.12), transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(255,45,149,.12), transparent 40%),
    radial-gradient(circle at 20% 20%, #182636 0%, #0a1118 45%, #05070b 100%);
  font-family:"Space Grotesk","Segoe UI",Tahoma,sans-serif;color:var(--white);
}
.frame{
  width:min(560px,92vw);aspect-ratio:9/16;position:relative;border-radius:26px;padding:12px;
  background:linear-gradient(150deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
  box-shadow:0 30px 90px rgba(0,0,0,.55);
}
.game-wrap{
  position:relative;width:100%;height:100%;
  border-radius:18px;overflow:hidden;
  background:
    radial-gradient(circle at 30% 20%, rgba(0,245,212,.14), transparent 45%),
    radial-gradient(circle at 70% 80%, rgba(255,45,149,.16), transparent 50%);
}
canvas{width:100%;height:100%;display:block;touch-action:none}

.hud{
  position:absolute;left:0;right:0;top:0;
  padding:14px 14px 0;
  display:grid;gap:10px;
  z-index:3;pointer-events:none;
}
.topRow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.pill{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:999px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--stroke);
  backdrop-filter: blur(10px);
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
  font-weight:800;font-size:.9rem;
  min-width: 116px;
}
.pill .label{opacity:.75;font-weight:800}
.pill .value{color:var(--sun);font-weight:900}
.pill.small{min-width:auto}
.hearts{letter-spacing:2px;color:var(--hot);text-shadow:0 0 14px rgba(255,45,149,.25)}

.flash{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:2.15rem;font-weight:950;color:var(--sun);
  text-shadow:0 0 22px rgba(255,230,109,.85);
  opacity:0;transition:opacity .18s ease;
  z-index:5;pointer-events:none;
}
.flash.show{opacity:1}

.screenFlash{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(circle at 50% 60%, rgba(0,245,212,.18), transparent 55%);
  opacity:0;transition:opacity .2s ease;
}
.screenFlash.hot{background:radial-gradient(circle at 50% 60%, rgba(255,45,149,.25), transparent 55%)}
.screenFlash.show{opacity:1}

.toast{
  position:absolute;left:50%;bottom:110px;transform:translateX(-50%);
  padding:10px 14px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 30px rgba(0,0,0,.25);
  font-weight:900;font-size:.95rem;opacity:0;transition:opacity .2s ease;
  z-index:6;pointer-events:none;
}
.toast.show{opacity:1}

.pulse{animation:pulse .22s ease-out}
@keyframes pulse{0%{transform:scale(1)}70%{transform:scale(1.07)}100%{transform:scale(1)}}
.spark{animation:spark .35s ease-out}
@keyframes spark{0%{box-shadow:0 0 0 rgba(0,245,212,0)}50%{box-shadow:0 0 30px rgba(0,245,212,.22)}100%{box-shadow:0 0 0 rgba(0,245,212,0)}}

/* Top-right menu button */
.menuBtn{
  position:absolute;top:12px;right:12px;z-index:6;
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 12px 30px rgba(0,0,0,.25);
  display:grid;place-items:center;
  cursor:pointer;pointer-events:auto;
}
.menuBtn:active{transform:scale(.98)}
.bars{width:18px;height:12px;display:grid;gap:4px}
.bars span{display:block;height:2px;border-radius:99px;background:rgba(248,250,252,.9)}

/* Menu overlay */
.overlay{
  position:absolute;inset:0;z-index:10;
  background:rgba(2,6,10,.62);
  backdrop-filter: blur(10px);
  display:none;
}
.overlay.show{display:block}
.modal{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(92%,420px);
  border-radius:22px;
  padding:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 30px 90px rgba(0,0,0,.55);
}
.title{
  font-size:1.3rem;font-weight:950;letter-spacing:.3px;
  margin:0 0 6px;
}
.sub{opacity:.75;margin:0 0 12px;font-weight:700;line-height:1.3}
.menuStats{
  display:grid;gap:4px;margin:0 0 10px;
  font-weight:800;opacity:.9
}
.menuStats span{color:var(--sun)}
.sectionTitle{
  margin:10px 0 6px;font-weight:900;letter-spacing:.2px;font-size:.95rem;
}
.dailyList{display:grid;gap:8px;margin-bottom:8px}
.dailyItem{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.12);
  font-weight:800;font-size:.9rem;
}
.dailyItem .meta{opacity:.75;font-weight:800}
.dailyItem.done{border-color:rgba(0,245,212,.35)}
.dailyItem.done .meta{color:var(--neon)}

.grid{display:grid;gap:10px}
.btn{
  width:100%;padding:12px 14px;border-radius:16px;
  background:linear-gradient(180deg,rgba(0,245,212,.16),rgba(0,245,212,.06));
  border:1px solid rgba(0,245,212,.22);
  color:var(--white);
  font-weight:900;font-size:1rem;
  cursor:pointer;
}
.btn.secondary{
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.14);
}
.btn.danger{
  background:linear-gradient(180deg,rgba(255,45,149,.18),rgba(255,45,149,.06));
  border:1px solid rgba(255,45,149,.22);
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.tog{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.14);
  font-weight:900;
}
.switch{
  width:46px;height:26px;border-radius:999px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.14);
  position:relative;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:999px;
  background:rgba(248,250,252,.9);
  transition:.18s ease;
}
.switch.on{background:rgba(0,245,212,.22);border-color:rgba(0,245,212,.28)}
.switch.on::after{left:23px;background:rgba(0,245,212,.95)}
.kbdline{
  margin-top:10px;opacity:.75;font-weight:700;font-size:.9rem;line-height:1.35
}
kbd{border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;padding:.05rem .35rem;border-radius:.35rem}
</style>
</head>

<body>
<div class="frame">
  <div class="game-wrap">
    <div class="hud">
      <div class="topRow">
        <div class="pill" id="scorePill"><span class="label">Score</span><span class="value" id="scoreText">0</span></div>
        <div class="pill" id="bestPill"><span class="label">Best</span><span class="value" id="bestText">0</span></div>
        <div class="pill" id="comboPill"><span class="label">Combo</span><span class="value" id="comboText">x1</span></div>
      </div>
      <div class="topRow">
        <div class="pill small" id="livesPill"><span class="label">Lives</span><span class="hearts" id="livesText">OOO</span></div>
        <div class="pill small" id="dashPill"><span class="label">Dash</span><span class="value" id="dashText">READY</span></div>
        <div class="pill small" id="shieldPill"><span class="label">Shield</span><span class="value" id="shieldText">OFF</span></div>
      </div>
    </div>

    <!-- Menu button -->
    <button class="menuBtn" id="menuBtn" aria-label="Menu">
      <div class="bars"><span></span><span></span><span></span></div>
    </button>

    <div class="flash" id="flash">GO!</div>
    <div class="screenFlash" id="screenFlash"></div>
    <div class="toast" id="toast">Copied!</div>

    <!-- Menu overlay -->
    <div class="overlay show" id="overlay">
      <div class="modal">
        <h1 class="title">AIN'T NO WAY</h1>
        <p class="sub" id="menuSub">Press Start to play.</p>
        <div class="menuStats" id="menuStats"></div>

        <div class="sectionTitle">Daily</div>
        <div class="dailyList" id="dailyList"></div>

        <div class="grid">
          <button class="btn" id="startBtn">Start</button>

          <div class="row2">
            <button class="btn secondary" id="resumeBtn">Resume</button>
            <button class="btn danger" id="restartBtn">Restart</button>
          </div>

          <div class="row2">
            <button class="btn secondary" id="shareBtn">Share</button>
            <div class="tog" id="ghostToggle">
              <span>Ghost</span>
              <div class="switch on" id="ghostSwitch" aria-label="Toggle ghost"></div>
            </div>
          </div>

          <div class="tog" id="soundToggle">
            <span>Sound</span>
            <div class="switch on" id="soundSwitch" aria-label="Toggle sound"></div>
          </div>

          <div class="kbdline">
            Move: <kbd>A</kbd>/<kbd>D</kbd> or <kbd>Arrow</kbd> keys | Dash: <kbd>Space</kbd> | Restart: <kbd>R</kbd> | Menu: <kbd>Esc</kbd>
          </div>
        </div>
      </div>
    </div>

    <canvas id="gameCanvas" width="540" height="960"></canvas>
  </div>
</div>

<script>
/* Endless runner style:
 - No timer/progress bar
 - Ramping difficulty with caps
 - Rare powerups
 - UI reactions + sound on near-miss
 - Menu overlay (start/resume/restart) + sound toggle
*/

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const flashEl = document.getElementById("flash");
const screenFlash = document.getElementById("screenFlash");
const toastEl = document.getElementById("toast");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");
const startBtn = document.getElementById("startBtn");
const resumeBtn = document.getElementById("resumeBtn");
const restartBtn = document.getElementById("restartBtn");
const soundToggle = document.getElementById("soundToggle");
const soundSwitch = document.getElementById("soundSwitch");
const ghostToggle = document.getElementById("ghostToggle");
const ghostSwitch = document.getElementById("ghostSwitch");
const shareBtn = document.getElementById("shareBtn");
const menuSub = document.getElementById("menuSub");
const menuStats = document.getElementById("menuStats");
const dailyList = document.getElementById("dailyList");

const scoreText = document.getElementById("scoreText");
const bestText  = document.getElementById("bestText");
const comboText = document.getElementById("comboText");
const livesText = document.getElementById("livesText");
const dashText  = document.getElementById("dashText");
const shieldText= document.getElementById("shieldText");

const scorePill = document.getElementById("scorePill");
const comboPill = document.getElementById("comboPill");
const dashPill  = document.getElementById("dashPill");
const livesPill = document.getElementById("livesPill");

const W = 540, H = 960;

// ===== State =====
let player, obstacles = [], pickups = [], floatTexts = [];
let lastTime = 0, startTime = performance.now();
let running = false;
let paused = true;
let gameOver = false;
let runTimeMs = 0;

// Input
const keys = { left:false, right:false };
let lastDir = 1;

// Dash
let dashCooldown = 0;
let dashTimer = 0;
const DASH_DURATION = 12;
const DASH_IMPULSE = 14;
const DASH_DECAY = 0.92;
let dashTrail = [];
const DASH_TRAIL_MAX = 18;

// ===== FEATURE: SCORE SYSTEM =====
let score = 0;
let best = Number(localStorage.getItem("aint_best") || 0);
let combo = 1;
let comboHits = 0;
let comboTimer = 0;
const COMBO_KEEP = 120;
let nearMissCount = 0;
let perfectCount = 0;

// Lives/shield
let lives = 3;
let shield = false;
let invuln = 0;

// ===== FEATURE: DIFFICULTY RAMP =====
let nextSpawnMs = 0;
let spawnBaseMs = 820;
let spawnMinMs  = 320;
let speedBase   = 6.2;
let speedMax    = 13.0;
let sizeBase    = 20;
let sizeMax     = 44;

// ===== FEATURE: POWER-UPS =====
let nextPickupMs = 0;
let pickupId = 0;

// ===== FEATURE: DAILY CHALLENGES =====
let daily = null;
let lastDailyRender = "";

// ===== FEATURE: GHOST RUN =====
let ghostEnabled = localStorage.getItem("aint_ghost") !== "off";
let ghostData = null;
let ghostIndex = 0;
let ghostRecord = [];
let ghostSampleTimer = 0;
let bestAtStart = best;

// ===== FEATURE: SHARE IMAGE =====
const shareCanvas = document.createElement("canvas");
const shareCtx = shareCanvas.getContext("2d");

// ===== Audio =====
let audioCtx=null;
let soundEnabled = true;

function ensureAudio(){
  if(!soundEnabled) return;
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume();
}
["pointerdown","keydown","mousedown","touchstart"].forEach(e=>{
  window.addEventListener(e, ()=>ensureAudio(), { once:true, passive:true });
});

function beep({freq=440,dur=0.08,type="sine",gain=0.06,slide=0}={}){
  if(!soundEnabled) return;
  ensureAudio();
  if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,t0);
  if(slide!==0) osc.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(gain,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0+dur+0.02);
}
const sfxDash  = ()=>beep({freq:520,dur:0.07,type:"square",gain:0.05,slide:260});
const sfxFail  = ()=>{beep({freq:210,dur:0.12,type:"sawtooth",gain:0.07,slide:-120}); setTimeout(()=>beep({freq:160,dur:0.16,type:"sawtooth",gain:0.06}),70);};
const sfxHit   = ()=>beep({freq:120,dur:0.10,type:"square",gain:0.06,slide:-60});
const sfxPickup= ()=>beep({freq:820,dur:0.08,type:"sine",gain:0.05,slide:220});
const sfxNear  = ()=>beep({freq:880,dur:0.05,type:"sine",gain:0.055,slide:-260});
const sfxPerfect = ()=>beep({freq:1200,dur:0.07,type:"sine",gain:0.06,slide:260});
const sfxTier = ()=>beep({freq:720,dur:0.08,type:"triangle",gain:0.07,slide:320});
const sfxComplete = ()=>beep({freq:980,dur:0.09,type:"sine",gain:0.06,slide:180});

// ===== Helpers =====
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rand(a,b){return a+Math.random()*(b-a);}

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  canvas.width=Math.round(rect.width*devicePixelRatio);
  canvas.height=Math.round(rect.height*devicePixelRatio);
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

function flash(text,ms=450){
  flashEl.textContent=text;
  flashEl.classList.add("show");
  if(ms<999999) setTimeout(()=>flashEl.classList.remove("show"), ms);
}
function flashScreen(isHot){
  screenFlash.classList.toggle("hot", !!isHot);
  screenFlash.classList.add("show");
  setTimeout(()=>screenFlash.classList.remove("show"), 160);
}
function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"), 900);
}

function pulse(el){
  el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
}
function spark(el){
  el.classList.remove("spark"); void el.offsetWidth; el.classList.add("spark");
}

// ===== FEATURE: HUD EFFICIENCY =====
const hudState = { score:"", best:"", combo:"", lives:"", dash:"", shield:"" };
function setHUD(){
  const s = String(Math.floor(score));
  const b = String(Math.floor(best));
  const c = `x${combo}`;
  const l = "O".repeat(lives) + "-".repeat(Math.max(0,3-lives));
  const d = (dashCooldown<=0 && dashTimer<=0) ? "READY" : `${Math.ceil(dashCooldown/60)}s`;
  const sh = shield ? "ON" : "OFF";

  if(hudState.score!==s){ scoreText.textContent=s; hudState.score=s; }
  if(hudState.best!==b){ bestText.textContent=b; hudState.best=b; }
  if(hudState.combo!==c){ comboText.textContent=c; hudState.combo=c; }
  if(hudState.lives!==l){ livesText.textContent=l; hudState.lives=l; }
  if(hudState.dash!==d){ dashText.textContent=d; hudState.dash=d; }
  if(hudState.shield!==sh){ shieldText.textContent=sh; hudState.shield=sh; }
}

function addFloatText(text, x, y, color="rgba(255,230,109,.95)"){
  floatTexts.push({ text, x, y, vy:-1.2, life:1, color });
}

// ===== FEATURE: DAILY CHALLENGES =====
function getDateKey(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function seededRand(seed){
  let t = seed + 0x6D2B79F5;
  t = Math.imul(t ^ t >>> 15, t | 1);
  t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function buildDaily(){
  const dateKey = getDateKey();
  const stored = localStorage.getItem("aint_daily");
  if(stored){
    const parsed = JSON.parse(stored);
    if(parsed.date === dateKey){
      daily = parsed;
      return;
    }
  }

  const seed = Number(dateKey.split("-").join(""));
  const pool = [
    { id:"survive45", text:"Survive 45 seconds", type:"time", target:45000 },
    { id:"near12", text:"Get 12 near-misses", type:"near", target:12 },
    { id:"perfect3", text:"Get 3 perfect dodges", type:"perfect", target:3 },
    { id:"combo3", text:"Reach combo x3 once", type:"combo3", target:1 },
    { id:"score1500", text:"Reach score 1500", type:"score", target:1500 }
  ];

  const picks = [];
  let r = seed;
  while(picks.length<3){
    r = Math.floor(seededRand(r)*100000);
    const idx = r % pool.length;
    const candidate = pool[idx];
    if(!picks.find(p=>p.id===candidate.id)) picks.push({...candidate, progress:0, done:false});
    r += 1337;
  }

  daily = { date: dateKey, list: picks };
  localStorage.setItem("aint_daily", JSON.stringify(daily));
}
function updateDailyProgress(){
  if(!daily) return;
  let changed = false;
  for(const c of daily.list){
    if(c.done) continue;
    let prog = 0;
    if(c.type==="time") prog = Math.min(runTimeMs, c.target);
    if(c.type==="near") prog = Math.min(nearMissCount, c.target);
    if(c.type==="perfect") prog = Math.min(perfectCount, c.target);
    if(c.type==="combo3") prog = Math.min(combo>=3?1:0, c.target);
    if(c.type==="score") prog = Math.min(score, c.target);
    if(prog !== c.progress){ c.progress = prog; changed = true; }
    if(!c.done && c.progress >= c.target){
      c.done = true;
      changed = true;
      addFloatText("Challenge Complete!", player.x, player.y-70, "rgba(0,245,212,.95)");
      showToast("Daily complete!");
      sfxComplete();
    }
  }
  if(changed){
    localStorage.setItem("aint_daily", JSON.stringify(daily));
    renderDaily();
  }
}
function renderDaily(){
  if(!daily) return;
  const lines = daily.list.map(c=>{
    const prog = c.type==="time" ? `${Math.floor(c.progress/1000)}s/${c.target/1000}s` : `${Math.floor(c.progress)}/${c.target}`;
    return `${c.text}|${prog}|${c.done?"1":"0"}`;
  }).join("\n");
  if(lines === lastDailyRender) return;
  lastDailyRender = lines;
  dailyList.innerHTML = "";
  daily.list.forEach(c=>{
    const item = document.createElement("div");
    item.className = "dailyItem" + (c.done?" done":"");
    const text = document.createElement("div");
    text.textContent = c.text;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = c.done ? "OK" : (c.type==="time" ? `${Math.floor(c.progress/1000)}s/${c.target/1000}s` : `${Math.floor(c.progress)}/${c.target}`);
    item.appendChild(text);
    item.appendChild(meta);
    dailyList.appendChild(item);
  });
}

// ===== Game setup/reset =====
let obId = 0;
function resetGame(){
  player = { x: W*0.5, y: H*0.82, r: 18, vx: 0, trail: [] };
  obstacles = [];
  pickups = [];
  floatTexts = [];
  dashTrail = [];

  lastTime = 0;
  startTime = performance.now();
  runTimeMs = 0;

  keys.left = keys.right = false;
  lastDir = 1;

  dashCooldown = 0;
  dashTimer = 0;

  score = 0;
  combo = 1;
  comboHits = 0;
  comboTimer = 0;
  nearMissCount = 0;
  perfectCount = 0;

  lives = 3;
  shield = false;
  invuln = 0;

  nextSpawnMs = 0;
  nextPickupMs = 20000 + Math.random()*9000;
  pickupId = 0;
  obId = 0;

  ghostRecord = [];
  ghostSampleTimer = 0;
  ghostIndex = 0;
  bestAtStart = best;

  gameOver = false;
  updateMenuStats();
  setHUD();
}

// ===== FEATURE: DIFFICULTY RAMP =====
function getDifficulty(elapsedMs){
  const t = clamp(elapsedMs / 60000, 0, 1);
  const s = t*t*(3-2*t);
  const spawnMs = Math.round(spawnBaseMs + (spawnMinMs - spawnBaseMs) * s);
  const speed   = speedBase + (speedMax - speedBase) * s;
  const size    = sizeBase + (sizeMax - sizeBase) * s;
  return { spawnMs, speed, size, s };
}

// ===== Spawning =====
function spawnObstacle(speed, size, x){
  obstacles.push({
    id: ++obId,
    x, y: -size*2,
    w: size*2, h: size*2,
    vy: speed,
    color: Math.random()>0.5 ? "#ff2d95" : "#ffe66d",
    scoredNear:false
  });
}
function maybeSpawnObstacle(elapsedMs){
  const d = getDifficulty(elapsedMs);
  if(elapsedMs < nextSpawnMs) return;
  const size = d.size;
  const speed = d.speed;
  let x = Math.random()*(W - size*2);
  if(Math.abs((x+size) - player.x) < 60) x = clamp(x + 120, 20, W - size*2 - 20);
  spawnObstacle(speed, size, x);
  const jitter = rand(-0.12, 0.12);
  nextSpawnMs = elapsedMs + Math.max(spawnMinMs, d.spawnMs * (1 + jitter));
}

// ===== FEATURE: POWER-UPS =====
function spawnPickup(type, x){
  const r  = type==="orb" ? 10 : 14;
  const vy = type==="orb" ? 4.6 : 4.0;
  const color = type==="shield" ? "#60a5fa" : type==="dash" ? "#34d399" : "#f59e0b";
  pickups.push({id:++pickupId,type,x,y:-40,r,vy,color,fx:1});
}
function canSpawnPickup(x){
  for(const o of obstacles){
    if(o.y < 140 && Math.abs((o.x+o.w*0.5) - x) < 70) return false;
  }
  return Math.abs(x - player.x) > 50;
}
function maybeSpawnPickup(elapsedMs){
  if(elapsedMs < nextPickupMs) return;
  let x = rand(40, W-40);
  let tries = 0;
  while(!canSpawnPickup(x) && tries < 6){ x = rand(40, W-40); tries++; }
  const roll = Math.random();
  if(roll < 0.36) spawnPickup("orb", x);
  else if(roll < 0.68) spawnPickup("dash", x);
  else spawnPickup("shield", x);
  nextPickupMs = elapsedMs + 20000 + Math.random()*12000;
}

// ===== FEATURE: SCORE SYSTEM =====
function addScore(points){
  score += points * combo;
  if(score > best){
    best = score;
    localStorage.setItem("aint_best", String(Math.floor(best)));
  }
}

// ===== FEATURE: COMBO SYSTEM =====
function bumpCombo(){
  comboHits++;
  comboTimer = COMBO_KEEP;
  const prev = combo;
  if(comboHits >= 6) combo = 3;
  else if(comboHits >= 3) combo = 2;
  else combo = 1;
  if(combo > prev){
    pulse(comboPill);
    sfxTier();
    addFloatText(`Combo x${combo}!`, player.x, player.y-64, "rgba(0,245,212,.95)");
  }
}

// ===== FEATURE: POWER-UPS =====
function applyPickup(type){
  if(type==="orb"){
    addScore(160);
    addFloatText("+160", player.x, player.y-36, "rgba(245,158,11,.95)");
    pulse(scorePill);
  } else if(type==="dash"){
    dashCooldown = Math.max(0, dashCooldown - 40);
    addFloatText("DASH+", player.x, player.y-36, "rgba(52,211,153,.95)");
    pulse(dashPill);
  } else if(type==="shield"){
    shield = true;
    addFloatText("SHIELD", player.x, player.y-36, "rgba(96,165,250,.95)");
    pulse(livesPill);
  }
  sfxPickup();
}

// ===== Dash =====
function tryDash(){
  if(dashCooldown>0 || dashTimer>0) return;
  dashTimer = DASH_DURATION;
  dashCooldown = 55;
  player.vx += lastDir * DASH_IMPULSE;
  player.vx = clamp(player.vx, -14, 14);
  dashTrail.push({x:player.x,y:player.y,life:1});
  if(dashTrail.length>DASH_TRAIL_MAX) dashTrail.shift();
  sfxDash();
  pulse(dashPill);
}

// ===== Updates =====
function movePlayer(delta){
  if(dashCooldown>0) dashCooldown--;
  if(invuln>0) invuln--;
  if(comboTimer>0) comboTimer--;
  if(comboTimer===0 && comboHits>0){
    comboHits=0; combo=1;
  }

  if(keys.left) lastDir=-1;
  if(keys.right) lastDir=1;

  const dir = (keys.left?-1:0) + (keys.right?1:0);

  if(dir!==0 && dashTimer<=0){
    player.vx += dir*0.55;
  }else if(dashTimer<=0){
    player.vx *= 0.90;
  }

  if(dashTimer>0){
    dashTimer--;
    player.vx *= DASH_DECAY;
    dashTrail.push({x:player.x,y:player.y,life:1});
    if(dashTrail.length>DASH_TRAIL_MAX) dashTrail.shift();
  } else {
    dashTrail = dashTrail.filter(p => (p.life -= 0.12) > 0);
  }

  player.vx = clamp(player.vx, -12, 12);
  player.x += player.vx * delta;

  if(player.x < player.r+8){ player.x=player.r+8; player.vx=0; }
  if(player.x > W-player.r-8){ player.x=W-player.r-8; player.vx=0; }
}
function updateObstacles(delta){
  for(const o of obstacles) o.y += o.vy*delta;
  obstacles = obstacles.filter(o=>o.y < H+220);
}
function updatePickups(delta){
  for(const p of pickups){ p.y += p.vy*delta; p.fx *= 0.92; }
  pickups = pickups.filter(p=>p.y < H+150);
}
function updateFloatTexts(){
  floatTexts = floatTexts.filter(ft=>{
    ft.y += ft.vy;
    ft.life -= 0.02;
    return ft.life>0;
  });
}
function checkPickupCollect(){
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    if(Math.hypot(player.x-p.x, player.y-p.y) < player.r+p.r){
      applyPickup(p.type);
      pickups.splice(i,1);
    }
  }
}

// ===== FEATURE: SCORE SYSTEM (Near-Miss + Perfect) =====
function scoreNearMisses(){
  for(const o of obstacles){
    if(o.scoredNear) continue;

    const yCenter=o.y+o.h*0.5;
    if(Math.abs(yCenter-player.y)>26) continue;

    const cx=clamp(player.x,o.x,o.x+o.w);
    const cy=clamp(player.y,o.y,o.y+o.h);
    const dist=Math.hypot(player.x-cx, player.y-cy);

    const nearZone=12;
    const perfectZone=5;
    if(dist >= player.r && dist <= player.r+nearZone){
      o.scoredNear=true;
      bumpCombo();
      nearMissCount++;

      if(dist <= player.r+perfectZone){
        addScore(80);
        perfectCount++;
        pulse(scorePill);
        spark(comboPill);
        addFloatText(`+${80*combo} PERFECT`, player.x, player.y-44, "rgba(255,45,149,.95)");
        flashScreen(true);
        sfxPerfect();
      } else {
        addScore(30);
        pulse(scorePill);
        spark(comboPill);
        addFloatText(`+${30*combo}`, player.x, player.y-44, "rgba(255,230,109,.95)");
        flashScreen(false);
        sfxNear();
      }
    }
  }
}
function checkCollisions(){
  for(const o of obstacles){
    const cx=clamp(player.x,o.x,o.x+o.w);
    const cy=clamp(player.y,o.y,o.y+o.h);
    if(Math.hypot(player.x-cx, player.y-cy) < player.r){
      onHit();
      return;
    }
  }
}
function onHit(){
  if(invuln>0) return;

  if(shield){
    shield=false;
    invuln=55;
    comboHits=0; combo=1; comboTimer=0;
    sfxHit();
    flash("SHIELD!",320);
    pulse(livesPill);
    return;
  }

  lives--;
  invuln=70;
  comboHits=0; combo=1; comboTimer=0;
  sfxHit();
  pulse(livesPill);

  if(lives<=0){
    running=false;
    paused=true;
    gameOver=true;
    onGameOver();
    flash("FAIL!", 700);
    sfxFail();
  } else {
    flash("HIT!", 260);
  }
}

// ===== Draw =====
function drawBackground(elapsedMs){
  ctx.clearRect(0,0,W,H);
  const pulse = 0.10 + Math.sin(elapsedMs/240)*0.08;
  ctx.fillStyle = `rgba(0,245,212,${pulse})`;
  ctx.fillRect(0,0,W,10);

  ctx.strokeStyle="rgba(255,255,255,0.08)";
  ctx.lineWidth=2;
  for(let i=0;i<6;i++){
    const off=(elapsedMs*0.08+i*160)%H;
    ctx.beginPath();
    ctx.moveTo(0,off);
    ctx.lineTo(W,off-40);
    ctx.stroke();
  }
}
function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function drawPickups(){
  for(const p of pickups){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*1.8,0,Math.PI*2);
    ctx.fillStyle = hexToRgba(p.color,0.12*(1+p.fx));
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=16;
    ctx.fill();
    ctx.shadowBlur=0;

    ctx.fillStyle="rgba(0,0,0,0.35)";
    ctx.font="bold 14px Segoe UI";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    const icon=p.type==="shield"?"S":p.type==="dash"?"D":"+";
    ctx.fillText(icon,p.x,p.y+0.5);
  }
}
function drawObstacles(){
  for(const o of obstacles){
    ctx.fillStyle=o.color;
    ctx.fillRect(o.x,o.y,o.w,o.h);
  }
}
function drawFloatTexts(){
  for(const ft of floatTexts){
    ctx.globalAlpha=clamp(ft.life,0,1);
    ctx.fillStyle=ft.color;
    ctx.font="900 18px Segoe UI";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha=1;
  }
}
function drawPlayer(){
  for(const p of dashTrail){
    const a=clamp(p.life,0,1);
    ctx.beginPath();
    ctx.arc(p.x,p.y,player.r*(0.9+(1-a)*0.4),0,Math.PI*2);
    ctx.fillStyle=`rgba(0,245,212,${a*0.35})`;
    ctx.fill();
  }

  player.trail.push({x:player.x,y:player.y});
  if(player.trail.length>20) player.trail.shift();
  player.trail.forEach((p,i)=>{
    const a=i/player.trail.length;
    ctx.beginPath();
    ctx.arc(p.x,p.y,player.r*(0.4+a*0.6),0,Math.PI*2);
    ctx.fillStyle=`rgba(0,245,212,${a*0.22})`;
    ctx.fill();
  });

  const blink = invuln>0 && Math.floor(invuln/6)%2===0;

  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle = blink ? "rgba(0,245,212,0.35)" : "#00f5d4";
  ctx.shadowColor="#00f5d4";
  ctx.shadowBlur=24;
  ctx.fill();
  ctx.shadowBlur=0;

  if(shield){
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.r+10,0,Math.PI*2);
    ctx.strokeStyle="rgba(96,165,250,0.9)";
    ctx.lineWidth=3;
    ctx.stroke();
  }
}

// ===== FEATURE: GHOST RUN =====
function loadGhost(){
  const raw = localStorage.getItem("aint_ghost_data");
  ghostData = raw ? JSON.parse(raw) : null;
}
function recordGhost(deltaMs){
  ghostSampleTimer += deltaMs;
  if(ghostSampleTimer < 100) return;
  ghostSampleTimer = 0;
  ghostRecord.push({ t: runTimeMs, x: player.x });
}
function saveGhostIfBest(){
  if(score <= bestAtStart) return;
  const data = { score: Math.floor(score), path: ghostRecord };
  localStorage.setItem("aint_ghost_data", JSON.stringify(data));
  loadGhost();
}
function drawGhost(){
  if(!ghostEnabled || !ghostData || !ghostData.path || ghostData.path.length<2) return;
  while(ghostIndex < ghostData.path.length-2 && ghostData.path[ghostIndex+1].t <= runTimeMs){
    ghostIndex++;
  }
  const a = ghostData.path[ghostIndex];
  const b = ghostData.path[ghostIndex+1];
  const t = b ? clamp((runTimeMs - a.t) / (b.t - a.t || 1), 0, 1) : 0;
  const x = b ? a.x + (b.x - a.x) * t : a.x;
  const y = player.y;
  ctx.beginPath();
  ctx.arc(x,y,player.r*0.9,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.22)";
  ctx.fill();
}

// ===== Menu control =====
function openMenu(text){
  menuSub.textContent = text || "Paused.";
  overlay.classList.add("show");
  paused = true;
  running = false;
  updateMenuStats();
}
function closeMenu(){
  overlay.classList.remove("show");
  paused = false;
  running = true;
  lastTime = 0;
  requestAnimationFrame(render);
}
function updateMenuStats(){
  if(!gameOver){
    menuStats.innerHTML = "";
    resumeBtn.disabled = false;
    startBtn.textContent = "Start";
    return;
  }
  const bestInt = Math.floor(best);
  const scoreInt = Math.floor(score);
  const diff = Math.max(0, bestInt - scoreInt);
  menuStats.innerHTML = `<div>Score: <span>${scoreInt}</span></div><div>Best: <span>${bestInt}</span></div><div>You were <span>${diff}</span> away from Best</div>`;
  resumeBtn.disabled = true;
  startBtn.textContent = "Play Again";
}

// ===== FEATURE: GAME OVER SCREEN =====
function onGameOver(){
  saveGhostIfBest();
  openMenu("Game Over");
}

// ===== FEATURE: SHARE IMAGE =====
async function shareImage(){
  const w = 900, h = 900;
  shareCanvas.width = w;
  shareCanvas.height = h;

  const g = shareCtx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,"#081421");
  g.addColorStop(1,"#1b0f1f");
  shareCtx.fillStyle = g;
  shareCtx.fillRect(0,0,w,h);

  shareCtx.fillStyle = "rgba(0,245,212,0.18)";
  shareCtx.fillRect(0,40,w,12);

  shareCtx.fillStyle = "#f8fafc";
  shareCtx.font = "900 56px Segoe UI";
  shareCtx.fillText("AIN'T NO WAY", 60, 140);

  shareCtx.fillStyle = "#ffe66d";
  shareCtx.font = "900 42px Segoe UI";
  shareCtx.fillText(`Score: ${Math.floor(score)}`, 60, 230);
  shareCtx.fillStyle = "#60a5fa";
  shareCtx.fillText(`Best: ${Math.floor(best)}`, 60, 290);
  shareCtx.fillStyle = "#34d399";
  shareCtx.fillText(`Combo: x${combo}`, 60, 350);

  shareCtx.fillStyle = "rgba(255,255,255,0.85)";
  shareCtx.font = "700 30px Segoe UI";
  shareCtx.fillText("Can you beat this?", 60, 430);

  shareCtx.strokeStyle = "rgba(255,255,255,0.12)";
  shareCtx.lineWidth = 4;
  shareCtx.strokeRect(40, 60, w-80, h-120);

  const blob = await new Promise(res=>shareCanvas.toBlob(res));
  if(!blob) return;

  if(navigator.clipboard && window.ClipboardItem){
    try{
      await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
      showToast("Copied!");
      return;
    }catch(e){
      // fallback
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "aint-no-way.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("Downloaded!");
}

// ===== Loop =====
function render(now){
  if(!running) return;

  if(!lastTime) lastTime=now;
  let delta=(now-lastTime)/16.67;
  lastTime=now;

  const elapsedMs = runTimeMs;
  runTimeMs += (delta*16.67);

  // survival score drip
  score += 0.45 * combo * delta;

  // difficulty + spawns
  maybeSpawnObstacle(elapsedMs);
  maybeSpawnPickup(elapsedMs);

  // updates
  movePlayer(delta);
  updateObstacles(delta);
  updatePickups(delta);

  // interactions
  checkPickupCollect();
  scoreNearMisses();
  checkCollisions();

  updateFloatTexts();
  updateDailyProgress();
  recordGhost(delta*16.67);

  // draw
  drawBackground(elapsedMs);
  drawPickups();
  drawObstacles();
  drawGhost();
  drawPlayer();
  drawFloatTexts();

  // best + hud
  if(score > best){
    best = score;
    localStorage.setItem("aint_best", String(Math.floor(best)));
  }
  setHUD();

  requestAnimationFrame(render);
}

// ===== Input =====
window.addEventListener("keydown",(e)=>{
  if(e.code==="Escape"){
    if(overlay.classList.contains("show")) closeMenu();
    else openMenu("Paused.");
    return;
  }

  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=true;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=true;

  if(e.code==="Space"){
    e.preventDefault();
    tryDash();
  }

  if(e.code==="KeyR"){
    resetGame();
    closeMenu();
    flash("GO!",400);
  }
});
window.addEventListener("keyup",(e)=>{
  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=false;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=false;
});

// ===== Menu buttons =====
menuBtn.addEventListener("click", ()=>{
  if(overlay.classList.contains("show")) closeMenu();
  else openMenu("Paused.");
});

startBtn.addEventListener("click", ()=>{

  resetGame();

});

});

shareBtn.addEventListener("click", ()=>{

});

// ===== Start =====
resizeCanvas();
buildDaily();
renderDaily();
loadGhost();
resetGame();
ghostSwitch.classList.toggle("on", ghostEnabled);
soundSwitch.classList.toggle("on", soundEnabled);
openMenu("Press Start to play.");
window.addEventListener("resize", resizeCanvas);
